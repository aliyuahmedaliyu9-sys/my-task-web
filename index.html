<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የታስክ መስሪያ ገጽ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .balance-box {
            background-color: #eef6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .task {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>የቀን ታስኮች</h2>
        
        <div class="balance-box">
            <h3>ያለዎ ነጥብ፦ <span id="points">0</span></h3>
        </div>

        <div class="task">
            <div>
                <strong>ቴሌግራም ቻናል ይቀላቀሉ</strong><br>
                <small>+20 ነጥብ</small>
            </div>
            <button id="task1Btn" onclick="completeTask('task1Btn', 20, 'https://t.me')">ስራ</button>
        </div>

        <div class="task">
            <div>
                <strong>ቪዲዮ ይመልከቱ</strong><br>
                <small>+15 ነጥብ</small>
            </div>
            <button id="task2Btn" onclick="completeTask('task2Btn', 15, 'https://youtube.com')">ስራ</button>
        </div>

    </div>

    <script>
        let totalPoints = 0;

        function completeTask(buttonId, points, link) {
            window.open(link, '_blank');
            totalPoints += points;
            document.getElementById('points').innerText = totalPoints;
            let btn = document.getElementById(buttonId);
            btn.innerText = "ተጠናቋል ✓";
            btn.disabled = true;
        }
    </script>

</body>
</html>
