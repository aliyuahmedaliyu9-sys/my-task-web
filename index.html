            <p>+10 ነጥብ</p>
        </div>
        <button onclick="openTaskLink(this, 10, 'https://t.me/aliyu_task_channel')">ስራ</button>
    </div>

    <button class="withdraw-btn" onclick="requestWithdrawal()">ብር ለመጠየቅ (Withdraw)</button>
</div>

<script>
    let totalPoints = 0;

    function openTaskLink(button, points, url) {
        window.open(url, '_blank');
        totalPoints += points;
        document.getElementById('points').innerText = totalPoints;
        button.innerText = 'ተጠናቋል ✓';
        button.disabled = true;
    }

    function requestWithdrawal() {
        if (totalPoints >= 1000) {
            alert("እንኳን ደስ አለዎት! 1000 ነጥብ ሞልተዋል። እባክዎን የቴሌብር/ባንክ ቁጥርዎን ለቦቱ ይላኩ።");
        } else {
            alert("ብር ለማውጣት ቢያንስ 1000 ነጥብ ያስፈልግዎታል! አሁን ያለዎት ነጥብ፦ " + totalPoints);
        }
    }
</script>

</body>
</html>
