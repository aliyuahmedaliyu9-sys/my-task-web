<div id="withdrawModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:10px; width:80%; max-width:400px; text-align:center;">
    <h3>🎉 እንኳን ደስ አለዎት!</h3>
    <p>1000 ነጥብ ሞልተዋል። እባክዎን የክፍያ መረጃዎን ያስገቡ።</p>

    <select id="paymentMethod" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px;">
      <option value="Telebirr">ቴሌብር (Telebirr)</option>
      <option value="CBE">የኢትዮጵያ ንግድ ባንክ (CBE)</option>
      <option value="CBO">ህብረት ባንክ / አቢሲንያ</option>
    </select>

    <input type="text" id="accountNumber" placeholder="የስልክ ወይም የአካውንት ቁጥር" style="width:90%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">

    <input type="text" id="accountName" placeholder="የአካውንቱ ሙሉ ስም" style="width:90%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;">

    <button onclick="submitWithdrawal()" style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; width:100%;">ላክ (Submit)</button>
  </div>
</div>
