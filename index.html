<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የታስክ መስሪያ ገጽ</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
            background-color: #f4f4f9;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .task-info {
            text-align: left;
        }
        .task-info h4 {
            margin: 0;
            font-size: 15px;
        }
        .task-info p {
            margin: 3px 0 0;
            color: #28a745;
            font-size: 13px;
            font-weight: bold;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .points-box {
            background: #eef7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .withdraw-btn {
            background-color: #28a745;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>የቀን ታስኮች</h2>
    
    <div class="points-box">
        ያለዎ ነጥብ፦ <span id="points">0</span>
    </div>

    <div class="task">
        <div class="task-info">
            <h4>ቴሌግራም ቻናል ይቀላቀሉ</h4>
            <p>+200 ነጥብ</p>
        </div>
        <button id="btn1" onclick="openTaskLink(this, 'btn1', 200, 'https://t.me/aliyu_task_channel')">ስራ</button>
    </div>

    <div class="task">
        <div class="task-info">
            <h4>ቪዲዮ ይመልከቱ</h4>
            <p>+200 ነጥብ</p>
        </div>
        <button id="btn2" onclick="openTaskLink(this, 'btn2', 200, 'https://youtube.com')">ስራ</button>
    </div>

    <div class="task">
        <div class="task-info">
            <h4>ዩቲዩብ ሰብስክራይብ ያድርጉ</h4>
            <p>+200 ነጥብ</p>
        </div>
        <button id="btn3" onclick="openTaskLink(this, 'btn3', 200, 'https://youtube.com')">ስራ</button>
    </div>

    <div class="task">
        <div class="task-info">
            <h4>ቲክቶክ ፎሎው ያድርጉ</h4>
            <p>+200 ነጥብ</p>
        </div>
        <button id="btn4" onclick="openTaskLink(this, 'btn4', 200, 'https://www.tiktok.com/@Aleyu3336')">ስራ</button>
    </div>

    <div class="task">
        <div class="task-info">
            <h4>ለጓደኛዎ ያጋሩ</h4>
            <p>+200 ነጥብ</p>
        </div>
        <button id="btn5" onclick="openTaskLink(this, 'btn5', 200, 'https://t.me/aliyu_task_channel')">ስራ</button>
    </div>

    <button class="withdraw-btn" onclick="requestWithdrawal()">ብር ለመጠየቅ (Withdraw)</button>
</div>

<script>
    let totalPoints = parseInt(localStorage.getItem('userPoints')) || 0;
    document.getElementById('points').innerText = totalPoints;

    ['btn1', 'btn2', 'btn3', 'btn4', 'btn5'].forEach(function(id) {
        if (localStorage.getItem(id) === 'done') {
            var btn = document.getElementById(id);
            if (btn) {
                btn.innerText = 'ተጠናቋል ✓';
                btn.disabled = true;
            }
        }
    });

    function openTaskLink(button, btnId, points, url) {
        window.open(url, '_blank');
        totalPoints += points;
        localStorage.setItem('userPoints', totalPoints);
        localStorage.setItem(btnId, 'done');
        
        document.getElementById('points').innerText = totalPoints;
        button.innerText = 'ተጠናቋል ✓';
        button.disabled = true;
    }

    function requestWithdrawal() {
        if (totalPoints >= 1000) {
            alert("እንኳን ደስ አለዎት! 1000 ነጥብ ሞልተዋል። እባክዎን የቴሌብር/ባንክ ቁጥርዎን ለቦቱ ይላኩ።");
        } else {
            alert("ብር ለማውጣት ቢያንስ 1000 ነጥብ ያስፈልግዎታል! አሁን ያለዎት ነጥብ፦ " + totalPoints);
        }
    }
</script>

</body>
</html>
